services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: twin
      CLICKHOUSE_PASSWORD: twin-lab-local
    volumes:
      - telemetry:/var/lib/clickhouse
  gateway:
    build: .
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    depends_on: [mqtt, clickhouse]
    ports: ["127.0.0.1:8000:8000"]
  replay:
    build: .
    profiles: [tools]
    command: python replay.py /data/twin-run.json
    volumes: ["./data:/data:ro"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yaml:/etc/prometheus/rules.yaml:ro
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/twin.json:ro
    ports: ["127.0.0.1:3000:3000"]
volumes:
  telemetry:
